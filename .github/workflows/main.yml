name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup Flutter (Stable Version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # نسخة مستقرة بتبعدنا عن أخطاء التحديثات الجديدة
          channel: 'stable'

      - name: Install dependencies
        run: |
          pip install flet==0.21.2

      - name: Build APK
        run: |
          flet build apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sindbad-app-stable
          path: build/apk/*.apk
