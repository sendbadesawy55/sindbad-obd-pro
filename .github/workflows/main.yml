name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install flet
      - name: Build APK
        run: |
          flet build apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sindbad-app
          path: build/apk/*.apk
