name: Build APK       - name: Build APK
        run: |
          flet build apk --project "SINDBAD_PRO" --org "com.sindbad.app" --include-packages flet,obd,pyserial

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Libraries
        run: |
          pip install flet==0.21.2
          pip install obd

      - name: Build APK
        run: |
          flet build apk --project "SINDBAD_PRO" --org "com.sindbad.app"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SINDBAD-OBD-FINAL
          path: build/apk/*.apk
