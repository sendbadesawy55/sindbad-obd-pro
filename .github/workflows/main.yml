import flet as ft

# تعريف الكلاس الخاص بعرض الحساسات (المكان اللي كان فيه المشكلة)
class SensorCard(ft.Column): 
    def __init__(self, name, value, icon_name, color):
        super().__init__()
        self.name = name
        self.value = value
        self.icon_name = icon_name
        self.color = color
        
        # تصميم الكارت اللي بيعرض البيانات
        self.controls = [
            ft.Container(
                content=ft.Row([
                    ft.Icon(self.icon_name, color=self.color, size=30),
                    ft.Column([
                        ft.Text(self.name, size=16, weight="bold"),
                        ft.Text(self.value, size=20, color=self.color),
                    ], spacing=2)
                ]),
                padding=15,
                bgcolor=ft.colors.with_opacity(0.1, self.color),
                border_radius=10,
                border=ft.border.all(1, self.color),
            )
        ]

def main(page: ft.Page):
    page.title = "SINDBAD OBD PRO"
    page.theme_mode = ft.ThemeMode.DARK
    page.scroll = ft.ScrollMode.AUTO
    
    # عنوان التطبيق
    page.add(
        ft.Text("Sindbad OBD Diagnostics", size=30, weight="bold", color=ft.colors.BLUE_400),
        ft.Divider(),
    )

    # أمثلة للحساسات (لاحظ استخدام ft.icons بحروف صغيرة)
    sensors = [
        SensorCard("Engine RPM", "0 RPM", ft.icons.SPEED, ft.colors.GREEN),
        SensorCard("Coolant Temp", "0 °C", ft.icons.THERMOSTAT, ft.colors.BLUE),
        SensorCard("Throttle Position", "0 %", ft.icons.SETTINGS_INPUT_COMPONENT, ft.colors.ORANGE),
        SensorCard("Battery Voltage", "0 V", ft.icons.BATTERY_CHARGING_FULL, ft.colors.RED),
    ]

    # إضافة الحساسات للصفحة
    grid = ft.Column(controls=sensors, spacing=10)
    page.add(grid)

    page.update()

# تشغيل التطبيق
if __name__ == "__main__":
    ft.app(target=main)
